# Puzzleboss Configuration
#
# Docker/Local Development (default):
#   - Just copy this file to puzzleboss.yaml and run: docker-compose up --build
#   - No changes needed!
#
# Production Deployment:
#   1. Copy this file to puzzleboss.yaml
#   2. Change MYSQL HOST to your MySQL server IP (e.g., 127.0.0.1 or your DB host)
#   3. Update PASSWORD to a secure password
#   4. Update APIURI to your production API endpoint
#   5. Set SKIP_GOOGLE_API and SKIP_PUZZCORD to "false" if using those features
#   6. Generate a real INTERNAL_TOKEN:  openssl rand -hex 32

MYSQL:
    USERNAME: puzzleboss
    PASSWORD: puzzleboss123
    HOST: mysql              # For Docker (docker-compose service name)
                             # For native: Change to "127.0.0.1" or your MySQL host
    DATABASE: puzzleboss
    # SSL Configuration (optional - comment out to disable SSL)
    # For Docker: Uses auto-generated MySQL certs from /var/lib/mysql-certs
    # For RDS: Download CA bundle from AWS (see CLAUDE.md)
    SSL:
        CA: /var/lib/mysql-certs/ca.pem  # For Docker
        # CA: /etc/ssl/certs/rds-ca-bundle.pem  # For RDS (uncomment and download cert)

API:
    APIURI: http://localhost:5000
    # Shared internal token: lets trusted server-side consumers (config.php
    # admin page, account signup page, pbmail_inbox) read /config with secrets
    # unredacted. Without it the API fails closed: GET /config and /huntinfo
    # still work, but secret values come back as "********".
    # Generate a real one for production:  openssl rand -hex 32
    # Can also be supplied via the INTERNAL_TOKEN env var (env wins over file).
    INTERNAL_TOKEN: dev-internal-token-change-me

# Allow the ?assumedid= URL parameter to impersonate any user (dev/testing
# only). SECURITY: this key is honored ONLY from this file — a config-table
# row named ALLOW_USERNAME_OVERRIDE is ignored, so a runtime config write
# can't enable the auth bypass. Absent means "false". Set to "false" (or
# remove) for production.
ALLOW_USERNAME_OVERRIDE: "true"

# Google Service Account (optional - for Drive/Sheets/Admin integration)
# 1. Create a service account in Google Cloud Console
# 2. Enable Domain-Wide Delegation
# 3. Download the JSON key file
# 4. Paste the full JSON contents into SERVICE_ACCOUNT_JSON in the config table
# 5. Set SERVICE_ACCOUNT_SUBJECT in the config table to your domain admin email
# See CLAUDE.md for detailed setup instructions
