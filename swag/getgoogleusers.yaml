tags:
  - Accounts
summary: List Google Workspace users
description: Returns all Google Workspace user accounts. Returns empty list if Google API is disabled.
responses:
    200:
        description: List of Google Workspace users with account details
    500:
      description: Unhandled server error
      schema:
        type: object
        properties:
          status:
            type: string
            example: error
          error:
            type: string
            description: Human-readable message
          error_type:
            type: string
            description: Python exception class name
          traceback:
            type: string
            description: Server traceback; this API is not internet-facing