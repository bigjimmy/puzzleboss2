tags:
  - Hints
summary: Delete a hint request
description: Removes a hint from the queue and reorders remaining hints
parameters:
  - name: id
    in: path
    type: integer
    required: true
    description: The hint ID to delete
responses:
  200:
    description: Hint deleted successfully
    schema:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: "Hint 1 deleted"
  404:
    description: Hint not found
  500:
    description: Unhandled server error
    schema:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          description: Human-readable message
        error_type:
          type: string
          description: Python exception class name
        traceback:
          type: string
          description: Server traceback; this API is not internet-facing