summary: List available data migrations
description: >
  Lists all data migrations discoverable in the migrations/ package. Run one
  with POST /migrate/<name>.
tags:
  - Migrations
parameters: []
responses:
  200:
    description: Map of migration name to its metadata
    schema:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        migrations:
          type: object
          description: Keyed by migration name
          additionalProperties:
            type: object
            properties:
              module:
                type: string
                description: Python module name inside the migrations package
              name:
                type: string
                description: Migration name (pass to POST /migrate/<name>)
              description:
                type: string
  500:
    description: Unhandled server error
    schema:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          description: Human-readable message
        error_type:
          type: string
          description: Python exception class name
        traceback:
          type: string
          description: Server traceback; this API is not internet-facing