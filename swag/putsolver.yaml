tags:
  - Solvers
description: Post New Solver
consumes:
    - application/json
parameters:
    - name: body
      in: body
      required: true
      schema:
        id: newsolver
        required:
            - name
            - fullname
        properties:
            name:
                type: string
                description: short name (userid) of the solver
            fullname:
                type: string
                description: full name of the solver
responses:
    200:
        description: Creation of solver OK
    500:
      description: Unhandled server error
      schema:
        type: object
        properties:
          status:
            type: string
            example: error
          error:
            type: string
            description: Human-readable message
          error_type:
            type: string
            description: Python exception class name
          traceback:
            type: string
            description: Server traceback; this API is not internet-facing