tags:
  - Rounds
description: Post New Round
consumes:
    - application/json
parameters:
    - name: body
      in: body
      required: true
      schema:
        id: newround
        required:
            - name
            - round_uri
        properties:
            name:
                type: string
                description: name of the puzzle
            round_uri:
                type: string
                description: URI for puzzle
responses:
    200:
        description: Creation of round OK
    500:
      description: Unhandled server error
      schema:
        type: object
        properties:
          status:
            type: string
            example: error
          error:
            type: string
            description: Human-readable message
          error_type:
            type: string
            description: Python exception class name
          traceback:
            type: string
            description: Server traceback; this API is not internet-facing