Download one hunt CSV archive
---
tags:
  - Backups
summary: Download one archived CSV, decompressed
description: |
  Streams one file out of s3://puzzleboss-hunt-backups/db/<timestamp>/,
  gunzipped, as text/csv with a Content-Disposition attachment header.

  filename must be exactly puzzle_view.csv or activity.csv; anything else is
  404, including the SQL dumps that sit in the same prefix. Downloads are
  logged at SEV3 with the requesting X-Remote-User.

  Requires X-PB-Internal-Token. The PHP tier attaches it only after a
  puzztech check.
parameters:
  - name: X-PB-Internal-Token
    in: header
    type: string
    required: true
    description: The internal token from puzzleboss.yaml API.INTERNAL_TOKEN. The PHP tier attaches it only after a puzztech check.
  - name: timestamp
    in: path
    type: string
    required: true
    description: The reset timestamp, as returned by GET /backups
  - name: filename
    in: path
    type: string
    required: true
    enum: [puzzle_view.csv, activity.csv]
responses:
  403:
    description: Missing or wrong internal token while ADMIN_TOKEN_ENFORCE is true
    schema:
      type: object
      properties:
        error: { type: string, example: internal token required }
  200:
    description: The CSV
    schema:
      type: file
  400:
    description: Malformed timestamp
  404:
    description: Not a downloadable archive file, or the object is missing
  500:
    description: Unhandled server error
    schema:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          description: Human-readable message
        error_type:
          type: string
          description: Python exception class name
        traceback:
          type: string
          description: Server traceback; this API is not internet-facing