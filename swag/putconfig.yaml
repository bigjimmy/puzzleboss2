summary: Update configuration
description: >
  Set a configuration key's value and/or its secret flag. cfgval and secret
  are each optional but at least one is required. Omitting secret preserves
  the key's existing flag; a secret-only request updates the flag of an
  existing key without touching its value (and fails if the key doesn't
  exist). Flagged keys' values are redacted in GET /config and GET /huntinfo
  responses (see getconfig). Keys whose names match the secret-name heuristic
  are redacted regardless of the flag.
tags:
  - Config
consumes:
  - application/json
parameters:
  - name: X-PB-Internal-Token
    in: header
    type: string
    required: false
    description: >
      Internal token (puzzleboss.yaml API.INTERNAL_TOKEN). This endpoint is
      admin-token-gated; when the ADMIN_TOKEN_ENFORCE config key is "true",
      requests without a valid token are rejected with 403.
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - cfgkey
      properties:
        cfgkey:
          type: string
          description: Configuration key to set
        cfgval:
          type: string
          description: Value to set for the configuration key (optional if secret is provided)
        secret:
          type: boolean
          description: Mark (true) or unmark (false) the key as secret; omit to preserve the current flag
responses:
  200:
    description: Configuration updated successfully
    schema:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
  403:
    description: Missing or invalid X-PB-Internal-Token while ADMIN_TOKEN_ENFORCE is true
    schema:
      type: object
      properties:
        error:
          type: string
          enum: ["internal token required"]
  500:
    description: Error updating configuration
    schema:
      type: object
      properties:
        error:
          type: string
        error_type:
          type: string
        traceback:
          type: string
