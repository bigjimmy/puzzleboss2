tags:
  - Rounds
responses:
    200:
        description: Basic listing of all rounds (id and name only — use /rounds/<id> for full round details)
        schema:
               id: rounds
               type: object
               properties:
                       status:
                           type: string
                           enum: ['ok']
                       rounds:
                           type: array
                           items:
                                   type: object
                                   properties:
                                    id:
                                        type: integer
                                    name:
                                        type: string
