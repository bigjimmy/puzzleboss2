tags:
  - Rounds
responses:
    200:
        description: Basic listing of all rounds (id and name only — use /rounds/<id> for full round details)
        schema:
               id: rounds
               type: object
               properties:
                       status:
                           type: string
                           enum: ['ok']
                       rounds:
                           type: array
                           items:
                                   type: object
                                   properties:
                                    id:
                                        type: integer
                                    name:
                                        type: string
    500:
      description: Unhandled server error
      schema:
        type: object
        properties:
          status:
            type: string
            example: error
          error:
            type: string
            description: Human-readable message
          error_type:
            type: string
            description: Python exception class name
          traceback:
            type: string
            description: Server traceback; this API is not internet-facing