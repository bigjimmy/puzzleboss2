tags:
  - Solvers
responses:
    200:
        description: Basic listing of all solvers
        schema:
               id: solvers
               type: object
               properties:
                       status:
                           type: string
                           enum: ['ok']
                       solvers:
                           type: array
                           items:
                                   type: object
                                   properties:
                                    id:
                                        type: integer
                                    name:
                                        type: string
                                    fullname:
                                        type: string
                                    chat_uid:
                                        type: string
                                        description: Discord user ID
                                    chat_name:
                                        type: string
                                        description: Discord username
    500:
      description: Unhandled server error
      schema:
        type: object
        properties:
          status:
            type: string
            example: error
          error:
            type: string
            description: Human-readable message
          error_type:
            type: string
            description: Python exception class name
          traceback:
            type: string
            description: Server traceback; this API is not internet-facing