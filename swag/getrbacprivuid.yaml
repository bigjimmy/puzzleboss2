tags:
  - RBAC
parameters:
    - in: path
      name: priv
      description: The privilege category we are checking for (e.g. puzztech)
      type: string
      required: true
    - in: path
      name: uid
      description: The UID of the solver we are checking
      type: integer
      required: true
responses:
    200:
      description: A boolean of whether user is allowed that privilege 
      schema:
          id: answer
          type: object
          properties:
           allowed:
             type: boolean
    500:
      description: Unhandled server error
      schema:
        type: object
        properties:
          status:
            type: string
            example: error
          error:
            type: string
            description: Human-readable message
          error_type:
            type: string
            description: Python exception class name
          traceback:
            type: string
            description: Server traceback; this API is not internet-facing