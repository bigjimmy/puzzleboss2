tags:
  - Hints
summary: Mark a hint as answered
description: Sets hint status to answered, records timestamp, and promotes remaining queue. Works on queued, ready, or submitted hints.
parameters:
  - name: id
    in: path
    type: integer
    required: true
    description: The hint ID to mark as answered
responses:
  200:
    description: Hint answered successfully
    schema:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: "Hint 1 answered"
  404:
    description: Hint not found or already answered
  500:
    description: Unhandled server error
    schema:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          description: Human-readable message
        error_type:
          type: string
          description: Python exception class name
        traceback:
          type: string
          description: Server traceback; this API is not internet-facing