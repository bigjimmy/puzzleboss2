tags:
  - Hints
summary: Get count of active hints
description: Returns the number of queued hint requests
responses:
  200:
    description: Count of active hints
    schema:
      type: object
      properties:
        status:
          type: string
          example: ok
        count:
          type: integer
          example: 3
  500:
    description: Unhandled server error
    schema:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          description: Human-readable message
        error_type:
          type: string
          description: Python exception class name
        traceback:
          type: string
          description: Server traceback; this API is not internet-facing