tags:
  - Hints
summary: Get all active hint requests
description: Returns all queued hint requests ordered by queue position
responses:
  200:
    description: List of active hints
    schema:
      type: object
      properties:
        status:
          type: string
          example: ok
        hints:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              puzzle_id:
                type: integer
              puzzle_name:
                type: string
              solver:
                type: string
              queue_position:
                type: integer
              request_text:
                type: string
              status:
                type: string
                enum: [queued, ready, submitted]
                description: >
                  Active hints only. _HINT_ACTIVE_STATES in pbrest restricts the
                  query to these three, so an answered hint is never returned here.
              created_at:
                type: string
              answered_at:
                type: string
              submitted_at:
                type: string
  500:
    description: Unhandled server error
    schema:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          description: Human-readable message
        error_type:
          type: string
          description: Python exception class name
        traceback:
          type: string
          description: Server traceback; this API is not internet-facing