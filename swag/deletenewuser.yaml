tags:
  - Accounts
summary: Delete a pending account registration
description: |
  Deletes by the newuser row's id (see GET /newusers), not by the
  verification code. Requires X-PB-Internal-Token when ADMIN_TOKEN_ENFORCE
  is true.
parameters:
  - name: new_user_id
    in: path
    type: integer
    required: true
    description: The id of the pending account (from GET /newusers)
responses:
    200:
        description: Pending account deleted
    403:
        description: Missing or invalid X-PB-Internal-Token (only when ADMIN_TOKEN_ENFORCE=true)
    500:
        description: No pending account found with that id
        schema:
            type: object
            properties:
                status:
                    type: string
                    example: error
                error:
                    type: string
                    description: Human-readable message
                error_type:
                    type: string
                    description: Python exception class name
                traceback:
                    type: string
                    description: Server traceback; this API is not internet-facing
