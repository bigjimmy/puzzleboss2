tags:
  - Rounds
parameters:
    - in: path
      name: id
      type: integer
      required: true
    - in: path
      name: part
      description: The single part to look up (e.g. name, answer)
      type: string
      required: true
responses:
    200:
      description: A single round part from one round
      schema:
          id: round
          type: object
          properties:
           round:
             type: object
             properties:
               part:
                   description: the part you asked for
    500:
      description: Unhandled server error
      schema:
        type: object
        properties:
          status:
            type: string
            example: error
          error:
            type: string
            description: Human-readable message
          error_type:
            type: string
            description: Python exception class name
          traceback:
            type: string
            description: Server traceback; this API is not internet-facing