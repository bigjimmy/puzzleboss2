tags:
  - Accounts
description: |
  Start New Account Registration. No password is collected: the Google
  Workspace account's real password is chosen by the account owner at their
  first Google sign-in (see GET /finishaccount), so nothing here is a secret
  at rest.
consumes:
    - application/json
parameters:
    - name: body
      in: body
      required: true
      schema:
        id: newuser
        required:
            - username
            - fullname
            - email
        properties:
            username:
                type: string
            fullname:
                type: string
            email:
                type: string
            
responses:
  400:
    description: A solver with that username already exists
    schema:
      type: object
      properties:
        status: { type: string, example: error }
        error: { type: string }
    200:
        description: New account ready for verification
        schema:
          id: usercode
          type: object
          properties:
           code:
             type: string
             description: Verification code to complete registration