tags:
  - Accounts
description: |
  Start New Account Registration. No password is collected: the Google
  Workspace account's real password is chosen by the account owner at their
  first Google sign-in (see GET /finishaccount), so nothing here is a secret
  at rest.
consumes:
    - application/json
parameters:
    - name: body
      in: body
      required: true
      schema:
        id: newuser
        required:
            - username
            - fullname
            - email
        properties:
            username:
                type: string
            fullname:
                type: string
            email:
                type: string
            
responses:
  200:
    description: Pending signup created and the verification email sent (or attempted)
    schema:
      id: usercode
      type: object
      properties:
        status:
          type: string
          example: ok
        code:
          type: string
          description: >
            Verification code, returned to the signup page so it can show the
            link if email delivery failed. It is a bearer credential for
            GET /finishaccount and is never listed by GET /newusers.
        email_error:
          type: string
          description: >
            Present only if the verification email could not be sent. The
            signup row exists and the code is still valid, so puzztech can
            hand the link over manually.
  400:
    description: A solver with that username already exists
    schema:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
  500:
    description: Unhandled server error
    schema:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          description: Human-readable message
        error_type:
          type: string
          description: Python exception class name
        traceback:
          type: string
          description: Server traceback; this API is not internet-facing
